<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; }
    .card {
      width: 1200px; height: 630px; box-sizing: border-box;
      background: linear-gradient(135deg, #0050AA 0%, #003c80 100%);
      color: #fff; text-align: center; padding: 60px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
    .check {
      width: 92px; height: 92px; border-radius: 24px; background: #FFF000; color: #0050AA;
      display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: 900;
    }
    .name { font-size: 96px; font-weight: 800; letter-spacing: -1px; }
    .claim { font-size: 42px; font-weight: 600; line-height: 1.25; max-width: 1000px; }
    .sub { margin-top: 32px; font-size: 30px; opacity: .95; }
    .sub b { color: #FFF000; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="check">✓</div>
      <div class="name">merkio</div>
    </div>
    <div class="claim">Einkaufs- &amp; To-do-Listen –<br>in Echtzeit teilen</div>
    <div class="sub">🛒 ✅ 📝 &nbsp;·&nbsp; <b>kostenlos</b> · Web &amp; Android</div>
  </div>
</body>
</html>
