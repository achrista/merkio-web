<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open-Source-Lizenzen – merkio</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0050AA" />
  <style>
    :root { --blue:#0050AA; --ink:#1a1c20; --muted:#5b6470; --bg:#f5f7fa; --card:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:820px; margin:0 auto; padding:0 20px; }
    header { padding:20px 0; }
    .headrow { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .logo img { height:64px; width:auto; display:block; }
    .langbar { display:flex; gap:6px; }
    .langbar button { border:1px solid #d3dae3; background:#fff; color:var(--muted); font:inherit; font-size:14px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer; transition:all .15s ease; }
    .langbar button:hover { border-color:var(--blue); color:var(--blue); }
    .langbar button.active { background:var(--blue); color:#fff; border-color:var(--blue); }
    main.legal { padding:24px 0 60px; }
    .back { display:inline-block; margin-bottom:16px; color:var(--blue); text-decoration:none; font-weight:600; }
    .back:hover { text-decoration:underline; }
    .card { background:var(--card); border-radius:16px; padding:28px; box-shadow:0 2px 12px rgba(20,28,40,.06); }
    .card h1 { font-size:28px; margin-bottom:18px; }
    .card h2 { font-size:19px; margin:26px 0 8px; }
    .card p { margin-bottom:10px; color:#2b3038; }
    .card a { color:var(--blue); }
    .card ul { margin:6px 0 14px 20px; color:#2b3038; }
    .card li { margin:2px 0; }
    .lic { color:var(--muted); font-size:14px; }
    footer { text-align:center; padding:28px 0; color:var(--muted); font-size:14px; border-top:1px solid #e4e8ee; }
    footer a { color:var(--blue); text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="headrow">
        <a class="logo" href="index.html"><img src="logomerkio1.png" alt="merkio" /></a>
        <nav class="langbar" aria-label="Sprache / Language / Langue">
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="fr">FR</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="legal">
    <div class="wrap">
      <a class="back" href="index.html" data-i18n="back"></a>
      <div class="card" data-i18n-html="content"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p><a href="index.html" data-i18n="home">merkio.de</a> · <a href="impressum.html" data-i18n="imprint">Impressum</a> · <a href="datenschutz.html" data-i18n="privacy">Datenschutz</a></p>
    </div>
  </footer>

  <script>
    // Sprachneutrale Bibliotheks-Listen (Lizenzen aus package.json / Maven-POMs erhoben)
    const APACHE = '<a href="https://www.apache.org/licenses/LICENSE-2.0" rel="noopener">Apache-2.0</a>';
    const MIT = '<a href="https://opensource.org/license/mit" rel="noopener">MIT</a>';
    const ISC = '<a href="https://opensource.org/license/isc-license-txt" rel="noopener">ISC</a>';
    const BSD2 = '<a href="https://opensource.org/license/bsd-2-clause" rel="noopener">BSD-2-Clause</a>';
    const MIT0 = '<a href="https://opensource.org/license/mit-0" rel="noopener">MIT-0</a>';

    const LIBS_ANDROID = `<ul>
      <li>Kotlin <span class="lic">– ${APACHE}</span></li>
      <li>Jetpack Compose &amp; AndroidX (Google) <span class="lic">– ${APACHE}</span></li>
      <li>Material 3 &amp; Material Icons (Google) <span class="lic">– ${APACHE}</span></li>
      <li>Retrofit 2 (Square) <span class="lic">– ${APACHE}</span></li>
      <li>OkHttp (Square) <span class="lic">– ${APACHE}</span></li>
      <li>Gson (Google) <span class="lic">– ${APACHE}</span></li>
      <li>Room (Google) <span class="lic">– ${APACHE}</span></li>
      <li>Firebase Cloud Messaging SDK (Google) <span class="lic">– ${APACHE}</span></li>
      <li>Compose Rich Editor (Mohamed Rejeb) <span class="lic">– ${APACHE}</span></li>
    </ul>`;

    const LIBS_PWA = `<ul>
      <li>React &amp; React DOM <span class="lic">– ${MIT}</span></li>
      <li>Vite &amp; vite-plugin-pwa / Workbox <span class="lic">– ${MIT}</span></li>
      <li>TanStack Query <span class="lic">– ${MIT}</span></li>
      <li>Tailwind CSS <span class="lic">– ${MIT}</span></li>
      <li>Tiptap &amp; ProseMirror <span class="lic">– ${MIT}</span></li>
      <li>React Router <span class="lic">– ${MIT}</span></li>
      <li>i18next, react-i18next &amp; i18next-browser-languagedetector <span class="lic">– ${MIT}</span></li>
      <li>axios <span class="lic">– ${MIT}</span></li>
      <li>Lucide (Icons) <span class="lic">– ${ISC}</span></li>
      <li>Sentry SDK <span class="lic">– ${MIT}</span></li>
    </ul>`;

    const LIBS_BACKEND = `<ul>
      <li>Node.js <span class="lic">– ${MIT}</span></li>
      <li>Express <span class="lic">– ${MIT}</span></li>
      <li>Drizzle ORM <span class="lic">– ${APACHE}</span></li>
      <li>Zod <span class="lic">– ${MIT}</span></li>
      <li>mysql2 <span class="lic">– ${MIT}</span></li>
      <li>bcryptjs <span class="lic">– ${MIT}</span></li>
      <li>jsonwebtoken <span class="lic">– ${MIT}</span></li>
      <li>firebase-admin <span class="lic">– ${APACHE}</span></li>
      <li>Nodemailer <span class="lic">– ${MIT0}</span></li>
      <li>Anthropic SDK <span class="lic">– ${MIT}</span></li>
      <li>Sentry SDK <span class="lic">– ${MIT}</span></li>
      <li>cors <span class="lic">– ${MIT}</span></li>
      <li>dotenv <span class="lic">– ${BSD2}</span></li>
    </ul>`;

    const I18N = {
      de: {
        _title: "Open-Source-Lizenzen – merkio",
        back: "← Zurück zur Startseite",
        home: "Startseite",
        imprint: "Impressum",
        privacy: "Datenschutz",
        content: `
          <h1>Open-Source-Lizenzen</h1>
          <p>merkio baut auf großartiger Open-Source-Software auf. Wir danken allen Entwicklerinnen und Entwicklern der folgenden Bibliotheken. Die jeweilige Lizenz ist verlinkt; die vollständigen Lizenztexte sind über die Links abrufbar.</p>
          <h2>Android-App</h2>
          ${LIBS_ANDROID}
          <h2>Web-App (app.merkio.de)</h2>
          ${LIBS_PWA}
          <h2>Server (api.merkio.de)</h2>
          <p class="lic">Diese Komponenten laufen serverseitig und werden nicht an Ihr Gerät ausgeliefert – der Vollständigkeit halber:</p>
          ${LIBS_BACKEND}
        `,
      },
      en: {
        _title: "Open-source licenses – merkio",
        back: "← Back to home",
        home: "Home",
        imprint: "Legal notice",
        privacy: "Privacy Policy",
        content: `
          <h1>Open-source licenses</h1>
          <p>merkio is built on great open-source software. We thank all developers of the following libraries. The respective license is linked; the full license texts are available via the links.</p>
          <h2>Android app</h2>
          ${LIBS_ANDROID}
          <h2>Web app (app.merkio.de)</h2>
          ${LIBS_PWA}
          <h2>Server (api.merkio.de)</h2>
          <p class="lic">These components run server-side and are not distributed to your device – listed for completeness:</p>
          ${LIBS_BACKEND}
        `,
      },
      fr: {
        _title: "Licences open source – merkio",
        back: "← Retour à l’accueil",
        home: "Accueil",
        imprint: "Mentions légales",
        privacy: "Confidentialité",
        content: `
          <h1>Licences open source</h1>
          <p>merkio repose sur d’excellents logiciels open source. Nous remercions tous les développeurs des bibliothèques suivantes. La licence correspondante est liée ; les textes complets des licences sont accessibles via les liens.</p>
          <h2>Application Android</h2>
          ${LIBS_ANDROID}
          <h2>Appli web (app.merkio.de)</h2>
          ${LIBS_PWA}
          <h2>Serveur (api.merkio.de)</h2>
          <p class="lic">Ces composants s’exécutent côté serveur et ne sont pas distribués sur votre appareil – mentionnés par souci d’exhaustivité :</p>
          ${LIBS_BACKEND}
        `,
      },
    };

    function applyLang(lang) {
      const dict = I18N[lang] || I18N.de;
      document.documentElement.lang = lang;
      document.title = dict._title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (dict[k] != null) el.textContent = dict[k];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const k = el.getAttribute('data-i18n-html');
        if (dict[k] != null) el.innerHTML = dict[k];
      });
      document.querySelectorAll('.langbar button').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
      });
      try { localStorage.setItem('merkio_lang', lang); } catch (_) {}
    }
    function detectLang() {
      try { const s = localStorage.getItem('merkio_lang'); if (s && I18N[s]) return s; } catch (_) {}
      const nav = (navigator.language || 'de').slice(0,2).toLowerCase();
      return I18N[nav] ? nav : 'de';
    }
    document.querySelectorAll('.langbar button').forEach(b => {
      b.addEventListener('click', () => applyLang(b.getAttribute('data-lang')));
    });
    applyLang(detectLang());
  </script>
</body>
</html>
