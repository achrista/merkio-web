<!DOCTYPE html>

  <meta name="theme-color" content="#0050AA" />
  <style>
    :root { --blue:#0050AA; --ink:#1a1c20; --muted:#5b6470; --bg:#f5f7fa; --card:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:820px; margin:0 auto; padding:0 20px; }
    header { padding:20px 0; }
    .headrow { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .logo img { height:64px; width:auto; display:block; }
    .langbar { display:flex; gap:6px; }
    .langbar button { border:1px solid #d3dae3; background:#fff; color:var(--muted); font:inherit; font-size:14px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer; transition:all .15s ease; }
    .langbar button:hover { border-color:var(--blue); color:var(--blue); }
    .langbar button.active { background:var(--blue); color:#fff; border-color:var(--blue); }
    main.legal { padding:24px 0 60px; }
    .back { display:inline-block; margin-bottom:16px; color:var(--blue); text-decoration:none; font-weight:600; }
    .back:hover { text-decoration:underline; }
    .card { background:var(--card); border-radius:16px; padding:28px; box-shadow:0 2px 12px rgba(20,28,40,.06); }
    .card h1 { font-size:28px; margin-bottom:18px; }
    .card h2 { font-size:19px; margin:26px 0 8px; }
    .card p { margin-bottom:10px; color:#2b3038; }
    .card a { color:var(--blue); }
    footer { text-align:center; padding:28px 0; color:var(--muted); font-size:14px; border-top:1px solid #e4e8ee; }
    footer a { color:var(--blue); text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="headrow">
        <a class="logo" href="index.html"><img src="logomerkio1.png" alt="merkio" /></a>
        <nav class="langbar" aria-label="Sprache / Language / Langue">
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="fr">FR</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="legal">
    <div class="wrap">
      <a class="back" href="index.html" data-i18n="back"></a>
      <div class="card" data-i18n-html="content"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p><a href="index.html" data-i18n="home">merkio.de</a> · <a href="datenschutz.html" data-i18n="privacy">Datenschutz</a> · <a href="lizenzen.html" data-i18n="licenses">Lizenzen</a></p>

          <h2>Haftung für Links</h2>

        `,
      },
      en: {
        _title: "Legal notice – merkio",
        back: "← Back to home",
        home: "Home",
        privacy: "Privacy Policy",
        licenses: "Licenses",
        content: `
          <h1>Legal notice</h1>
          <h2>Information pursuant to § 5 DDG (German Digital Services Act)</h2>
          <p>
            Christa Consult<br>
            Arnulf Christa<br>
            Korianderweg 18<br>

          </p>

        privacy: "Confidentialité",
        licenses: "Licences",

    function applyLang(lang) {
      const dict = I18N[lang] || I18N.de;
      document.documentElement.lang = lang;
      document.title = dict._title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (dict[k] != null) el.textContent = dict[k];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const k = el.getAttribute('data-i18n-html');
        if (dict[k] != null) el.innerHTML = dict[k];
      });
      document.querySelectorAll('.langbar button').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
      });
      try { localStorage.setItem('merkio_lang', lang); } catch (_) {}
    }
    function detectLang() {
      try { const s = localStorage.getItem('merkio_lang'); if (s && I18N[s]) return s; } catch (_) {}
      const nav = (navigator.language || 'de').slice(0,2).toLowerCase();
      return I18N[nav] ? nav : 'de';
    }
    document.querySelectorAll('.langbar button').forEach(b => {
      b.addEventListener('click', () => applyLang(b.getAttribute('data-lang')));
    });
    applyLang(detectLang());
  </script>
</body>
</html>
