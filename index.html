    :root {
      --blue: #0050AA;

      --yellow: #FFF000;
      --ink: #1a1c20;
      --muted: #5b6470;
      --bg: #f5f7fa;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

    /* ── Header / Logo / Sprachwahl ─────────────── */
    header { padding: 28px 0; }
    .headrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .logo img { height: 192px; width: auto; display: block; }
    .langbar { display: flex; gap: 6px; }
    .langbar button {
      border: 1px solid #d3dae3; background: #fff; color: var(--muted);
      font: inherit; font-size: 14px; font-weight: 600;
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
      transition: all .15s ease;
    }
    .langbar button:hover { border-color: var(--blue); color: var(--blue); }
    .langbar button.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    /* ── Hero ───────────────────────────────── */
    .hero {
      text-align: center;
      padding: 40px 0 64px;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    }
    .hero h1 {
      font-size: clamp(30px, 6vw, 46px);
      font-weight: 800; line-height: 1.15; margin: 28px 0 16px;
    }
    .hero h1 .accent { color: var(--blue); }
    .hero p.lead {
      font-size: clamp(17px, 2.5vw, 20px); color: var(--muted);
      max-width: 540px; margin: 0 auto 36px;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--blue); color: #fff; text-decoration: none;
      font-weight: 700; font-size: 18px;
      padding: 16px 30px; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,80,170,0.28);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:hover { background: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,80,170,0.35); }
    .btn svg { width: 22px; height: 22px; }
    .btn-note { display: block; margin-top: 14px; font-size: 14px; color: var(--muted); }

    /* ── Sections ───────────────────────────── */
    section.block { padding: 56px 0; }
    section.block h2 {
      font-size: clamp(22px, 4vw, 30px); font-weight: 800;
      text-align: center; margin-bottom: 40px;
    }

    /* Features */
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
    .feature {
      background: var(--card); border-radius: 16px; padding: 26px;
      box-shadow: 0 2px 12px rgba(20,28,40,0.06);
    }
    .feature .ico {
      width: 46px; height: 46px; border-radius: 12px; background: #eaf2fc;
      display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
      font-size: 24px;
    }
    .feature h3 { font-size: 18px; margin-bottom: 6px; }
    .feature p { color: var(--muted); font-size: 15px; }

    /* Install steps */
    .steps { counter-reset: step; max-width: 620px; margin: 0 auto; }
    .step {
      display: flex; gap: 18px; align-items: flex-start;
      background: var(--card); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(20,28,40,0.06);
    }
    .step::before {
      counter-increment: step; content: counter(step);
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
      background: var(--blue); color: #fff; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .step h3 { font-size: 17px; margin-bottom: 2px; }
    .step p { color: var(--muted); font-size: 15px; }
    .step code { background: #eef1f5; padding: 1px 6px; border-radius: 5px; font-size: 13px; }

    .hint {
      max-width: 620px; margin: 24px auto 0; padding: 16px 18px;
      background: #fffbe6; border: 1px solid #ffe27a; border-radius: 12px;
      font-size: 14px; color: #6b5800;

      border-top: 1px solid #e4e8ee;

    function applyLang(lang) {
      const dict = I18N[lang] || I18N.de;
      document.documentElement.lang = lang;
      document.title = dict._title;
      const md = document.getElementById('meta-desc');
      if (md) md.setAttribute('content', dict._desc);

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (dict[k] != null) el.textContent = dict[k];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const k = el.getAttribute('data-i18n-html');
        if (dict[k] != null) el.innerHTML = dict[k];
      });

      // Jahr in den (ggf. neu gesetzten) Footer einfügen
      const y = document.getElementById('year');
      if (y) y.textContent = new Date().getFullYear();

      document.querySelectorAll('.langbar button').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
      });
      try { localStorage.setItem('merkio_lang', lang); } catch (_) {}
    }

    function detectLang() {
      try {
        const saved = localStorage.getItem('merkio_lang');
        if (saved && I18N[saved]) return saved;
      } catch (_) {}
      const nav = (navigator.language || 'de').slice(0, 2).toLowerCase();
      return I18N[nav] ? nav : 'de';
    }

    document.querySelectorAll('.langbar button').forEach(b => {
      b.addEventListener('click', () => applyLang(b.getAttribute('data-lang')));
    });

    applyLang(detectLang());
